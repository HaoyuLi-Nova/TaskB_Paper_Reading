# Master paper catalog for the VideoGen / Controllable Generation reading project.
# Each entry: id, track, slug, title, venue, year, arxiv, status, priority, deps
# translation: translations/<track>/<slug>/paper_zh.md  (full Chinese translation)
# notes: notes/<track>/<slug>/{QA,critique,note}.md  (reading notes — not translations)
# status: pending | downloading | reading | notes_done | mastered
# priority: P0 (must) | P1 (important) | P2 (context)

version: 1
updated: 2026-09-30

tracks:
  foundations:
    name: Foundations — 模型结构与自监督前置
    description: CNN/Transformer/自监督等基础论文（原 Task B），长期作为前置知识与代码学习线
  base_models:
    name: Base Models — 生成基座与可控生成插件
    description: LDM/DiT/Flow 基座 + ControlNet 系条件控制 + 开源图像/视频大模型
  geometry_control:
    name: Geometry Control — 相机/物体/角色运动控制
    description: 视频生成中的相机轨迹、物体运动、角色与多任务控制
  multi_view:
    name: Multi-View Generation — 多视角与 3D 一致性
    description: 多相机同步、单视频重拍、3D 感知视频/多视角扩散
  streaming:
    name: Streaming Video Generation — 自回归/流式视频扩散
    description: Diffusion Forcing / Self Forcing：训练-测试一致性与长视频生成
  long_video:
    name: Long Video Generation — 长视频生成方法
    description: 分层关键帧、免训练外推、token 流、LLM 分镜与长视频综述；Forcing 系见 streaming
  vla:
    name: VLA — Vision-Language-Action 具身智能
    description: 视觉-语言-动作基础模型与机器人操作策略
  audio_driven:
    name: Audio-Driven — 语音驱动视频与音色协调
    description: 音频驱动说话人/人体动画、多人声脸绑定、face/text-guided VC；服务 HarmonizedVisualAudio 项目
  visual_dubbing:
    name: Visual Dubbing — 画面译制与跨语言说话脸编辑
    description: mask/mask-free 口型同步、V2V 译制编辑、跨语言面部表演；服务 Faceglot（SIGGRAPH 2026）
  eeg_visual:
    name: EEG Visual Generation — 脑电驱动图像/视频/3D
    description: 非侵入式 EEG 到图像、视频、3D 的解码与生成；有开源实现的工作优先入库
  remote_sensing:
    name: Remote Sensing — 遥感影像融合与 pansharpening
    description: 全色锐化、多光谱融合、遥感 SSM/Mamba；与视频生成主线正交，按需入库
  spatial:
    name: Spatial Understanding — 视觉语言模型的空间理解
    description: RGB 空间问答、场景级三维语言任务，以及推理时在模型内部形成三维表示；与视频生成主线正交。P0 为 2026 年五篇，P1 为读懂它们所需的上下文，P2 为十一篇之后再看的变体

