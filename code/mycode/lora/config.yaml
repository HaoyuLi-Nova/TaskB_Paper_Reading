# Wan2.2-TI2V-5B LoRA lab. Paths live under video_workspace.

hf_endpoint: https://hf-mirror.com
dataset_repo: finetrainers/crush-smol
trigger: PIKA_CRUSH

data_root: /data1/lihaoyu/video_workspace/data/lora/crush-smol
run_root: /data1/lihaoyu/video_workspace/runs/lora/crush-smol
ckpt_dir: /data1/lihaoyu/video_workspace/models/Wan-AI/Wan2.2-TI2V-5B
wan_code: /home/lihaoyu/projects/VedioGen/HarmonizedVisualAudio/paper_reading/code/base_models/Wan2.2

# 4n+1 frames; H/W divisible by 32 (VAE 16 x patch 2)
frames: 17
height: 480
width: 480

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  # attention only; skip FFN and AdaLN modulation
  targets:
    - self_attn.q
    - self_attn.k
    - self_attn.v
    - self_attn.o
    - cross_attn.q
    - cross_attn.k
    - cross_attn.v
    - cross_attn.o

train:
  steps: 600
  lr: 1.0e-4
  batch_size: 1
  weight_decay: 0.01
  shift: 5.0
  log_every: 20
  save_every: 200

infer:
  steps: 30
  guide_scale: 5.0
  seed: 42
  prompt: "PIKA_CRUSH A red toy car is crushed by a hydraulic press, flattening objects as if they were under a hydraulic press."
